name: release
# Push a tag like v1.1.0 and GitHub builds the Mac and Windows apps and attaches them to a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: tokenwatt-macOS-AppleSilicon.zip
          - os: macos-15-intel
            asset: tokenwatt-macOS-Intel.zip
          - os: windows-latest
            asset: tokenwatt-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[app,dev]" pyinstaller
      - run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - run: pyinstaller --noconfirm tokenwatt.spec
      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --sequesterRsrc --keepParent tokenwatt.app "../${{ matrix.asset }}"
      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path "dist/tokenwatt" -DestinationPath "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}
